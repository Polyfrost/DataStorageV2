name: "Check Bundles"
on:
  pull_request:
    paths:
      - data/oneclient/bundles/.mrpacks/**
      - data/oneclient/bundles/disable-warnings.json
      - data/oneclient/bundles/disable-warnings/**
  push:
    paths:
      - data/oneclient/bundles/.mrpacks/**
      - data/oneclient/bundles/disable-warnings.json
      - data/oneclient/bundles/disable-warnings/**
  workflow_dispatch:

jobs:
  CheckBundles:
    name: Check bundles are correctly formatted
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Check bundles
        run: pnpm check

  CheckCompat:
    name: Check mod compatibility (fabric.mod.json)
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install node dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit test version matcher
        run: pnpm test

      - name: Check compatibility
        run: pnpm check:compat
